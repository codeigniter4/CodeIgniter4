# When a Pull Request is opened that modifies
# the User Guide source, build the User Guide
# with Sphinx or MkDocs and let the contributor
# know of any errors.
name: Test User Guide

on:
  pull_request:
    paths:
      - 'user_guide_src/**'
      - 'docs/**'
      - 'mkdocs.yml'
      - 'admin/anchors.py'
      - 'admin/llms.py'
      - 'admin/update-docs-nav.php'
      - '.github/workflows/test-userguide.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  syntax_check:
    name: Check User Guide syntax
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install Sphinx
        run: |
          python -m pip install --upgrade pip
          pip install -r user_guide_src/requirements.txt

      - name: Detect usage of tabs in RST files
        run: php utils/check_tabs_in_rst.php

      - name: Build Docs with Sphinx
        run: make html SPHINXOPTS="-W --keep-going -w /tmp/sphinx-log"
        working-directory: user_guide_src

  markdown_check:
    name: Check Markdown User Guide
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          coverage: none

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install MkDocs
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt

      - name: Check that every page is in the nav
        run: php admin/update-docs-nav.php --check

      - name: Build Docs with MkDocs
        env:
          NO_MKDOCS_2_WARNING: '1'
        run: mkdocs build --strict

      - name: Write the llms files and the anchor aliases
        run: |
          python admin/llms.py
          python admin/anchors.py
