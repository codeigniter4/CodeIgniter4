# When changes are pushed to the develop branch or the next minor branch,
# build the develop and the next minor versions of the User Guide
# with MkDocs and deploy them to GitHub Pages.
name: Deploy User Guide (latest)

on:
  push:
    branches:
      - 'develop'
      - '4.8'
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'admin/anchors.py'
      - 'admin/llms.py'
      - '.github/workflows/deploy-userguide-latest.yml'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build User Guide
    if: (github.repository == 'codeigniter4/CodeIgniter4')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 'develop'
          path: develop
          persist-credentials: false

      - name: Checkout next minor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: '4.8'
          path: next
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install MkDocs
        run: |
          python -m pip install --upgrade pip
          pip install -r develop/docs/requirements.txt

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build the sites
        env:
          NO_MKDOCS_2_WARNING: '1'
          BASE_URL: https://codeigniter4.github.io/CodeIgniter4
        run: |
          mkdir pages

          for name in develop next; do
            if [ ! -f "${name}/mkdocs.yml" ]; then
              echo "::notice::The ${name} branch has no mkdocs.yml, so it is not deployed."
              continue
            fi

            (
              cd "${name}"
              SITE_URL="${BASE_URL}/${name}/" mkdocs build --strict
              python admin/llms.py
              python admin/anchors.py
            )

            mv "${name}/site" "pages/${name}"
          done

          cp develop/docs/overrides/assets/versions.json pages/versions.json
          echo '<!doctype html><meta http-equiv="refresh" content="0; url=develop/">' > pages/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: pages

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
