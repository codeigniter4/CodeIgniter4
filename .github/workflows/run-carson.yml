name: Carson

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - labeled
      - ready_for_review
  issues:
    types:
      - opened
      - edited
      - labeled
  issue_comment:
    types:
      - created
  push:
    branches:
      - develop
      - '4.*'
  schedule:
    - cron: '0 0 * * *'

permissions: {}

jobs:
  carson:
    if: github.repository == 'codeigniter4/CodeIgniter4'
    runs-on: ubuntu-24.04
    steps:
      - name: Run Carson
        uses: NexusPHP/carson@53c45cf25e2303bc503209f8b5dd9107f27b2e8f # v1.8.0
        with:
          app_id: ${{ secrets.CARSON_APP_ID }}
          private_key: ${{ secrets.CARSON_PRIVATE_KEY }}
          log_level: info
