name: Carson

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - labeled
      - ready_for_review
  issues:
    types:
      - opened
      - edited
      - labeled
  push:
    branches:
      - develop
      - '4.*'
  schedule:
    - cron: '0 0 * * *'

permissions: {}

jobs:
  carson:
    runs-on: ubuntu-24.04
    steps:
      - name: Run Carson
        uses: NexusPHP/carson@e4b2fde33f32c47455df218cf1765702c15c3b8b # v1.6.0
        with:
          app_id: ${{ secrets.CARSON_APP_ID }}
          private_key: ${{ secrets.CARSON_PRIVATE_KEY }}
          log_level: info
