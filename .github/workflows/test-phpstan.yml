# When a PR is opened or a push is made, perform
# a static analysis check on the code using PHPStan.
name: PHPStan

on:
  pull_request:
    branches:
      - 'develop'
      - '4.*'
    paths:
      - 'app/**.php'
      - 'system/**.php'
      - 'tests/**.php'
      - 'utils/**.php'
      - composer.json
      - phpstan.dist.neon
      - phpstan-baseline.php
      - 'docs/**'
      - 'admin/lint-docs-samples.php'
      - 'admin/docs-phpstan-baseline.php'
      - '.github/workflows/test-phpstan.yml'

  push:
    branches:
      - 'develop'
      - '4.*'
    paths:
      - 'app/**.php'
      - 'system/**.php'
      - 'tests/**.php'
      - 'utils/**.php'
      - composer.json
      - phpstan.dist.neon
      - phpstan-baseline.php
      - 'docs/**'
      - 'admin/lint-docs-samples.php'
      - 'admin/docs-phpstan-baseline.php'
      - '.github/workflows/test-phpstan.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: PHP ${{ matrix.php-versions }} Static Analysis
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: intl
          coverage: none

      - name: Use latest Composer
        run: composer self-update

      - name: Validate composer.json
        run: composer validate --strict

      - name: Create PHPStan result cache directory
        run: mkdir -p build/phpstan

      - name: Cache PHPStan result cache directory
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/phpstan
          key: phpstan-${{ hashFiles('**/*.php', '**/*.neon', 'composer.json') }}
          restore-keys: phpstan-

      - name: Install dependencies
        uses: ./.github/actions/composer-update
        with:
          php-version: '8.3'

      - name: Run static analysis
        run: composer phpstan:check

      - name: Check that the baseline of the user guide samples is up to date
        run: |
          composer phpstan:docs-baseline
          git diff --exit-code admin/docs-phpstan-baseline.php
