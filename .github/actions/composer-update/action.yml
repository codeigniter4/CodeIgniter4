name: Composer update
description: Restores the Composer download cache, runs `composer update` with retries and saves the cache for the resolved dependencies.

inputs:
  php-version:
    description: PHP version used as part of the cache key
    required: true
  options:
    description: Additional options appended to the `composer update` call
    required: false
    default: ''
  github-token:
    description: Token used to authenticate the downloads from GitHub
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Get composer cache directory
      id: composer-cache
      shell: bash
      run: echo "COMPOSER_CACHE_FILES_DIR=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

    - name: Restore composer cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.composer-cache.outputs.COMPOSER_CACHE_FILES_DIR }}
        # Never matches an entry, so the restore always falls back to restore-keys.
        key: composer-php-${{ inputs.php-version }}-restore-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          composer-php-${{ inputs.php-version }}-
          composer-

    - name: Install dependencies
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        COMPOSER_OPTIONS: ${{ inputs.options }}
      run: |
        if [ -n "$GITHUB_TOKEN" ]; then
          composer config --global github-oauth.github.com "$GITHUB_TOKEN"
        fi

        attempt=1
        until composer update --ansi --no-interaction $COMPOSER_OPTIONS; do
          if [ "$attempt" -ge 3 ]; then
            echo "::error::composer update failed after $attempt attempts."
            exit 1
          fi

          delay=$((attempt * 30))
          echo "::warning::composer update failed on attempt $attempt. Retrying in ${delay}s."
          sleep "$delay"
          attempt=$((attempt + 1))
        done

    - name: Save composer cache
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.composer-cache.outputs.COMPOSER_CACHE_FILES_DIR }}
        key: composer-php-${{ inputs.php-version }}-${{ hashFiles('composer.lock') }}
